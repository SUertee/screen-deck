name: Desktop checks

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop-checks:
    name: Desktop checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.21.1'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test the read-only record validator with temporary data
        working-directory: .
        run: node --test scripts/validate-project-workspace.test.mjs
      - name: Check commit whitespace
        working-directory: .
        run: git show --format= --check HEAD
