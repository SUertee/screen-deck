# Shared declarations only. Loading this file never starts commands or grants permission.
config_version = 1

[workspace]
editable_roots = ["desktop", "scripts", "Resources/Schemas"]
protected_paths = [".git", ".screendeck/project.json", "archive"]
ignored_paths = ["archive", "desktop/node_modules", "desktop/dist", "desktop/dist-release", "desktop/artifacts"]

[validation]
test_argv = ["npm", "--prefix", "desktop", "test"]
build_argv = ["npm", "--prefix", "desktop", "run", "build"]

[documentation]
directory = "docs"

[handoff]
summary_path = "AGENTLOG.md"
